[tool.poetry]
name = "pythonproject-coursework-1"
version = "0.1.0"
description = "Coursework: Bank transactions analysis"
authors = ["viktor bezuglov <bezza8418@gmail.com>"]
package-mode = false  # Добавляем эту строку!

[tool.poetry.dependencies]
python = "^3.14"
pandas = "^3.0.1"
openpyxl = "^3.1.5"
requests = "^2.32.5"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
flake8 = "^7.3.0"
black = "^26.3.0"
isort = "^8.0.1"
mypy = "^1.19.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# Конфигурация black
[tool.black]
line-length = 119
target-version = ['py314']
extend-exclude = '''
/(
    \.git
    | \.venv
    | venv
    | build
    | dist
)/
'''

# Конфигурация isort
[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true

# Конфигурация mypy
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ['venv/', '\.venv/', 'build/', 'dist/']

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "openpyxl.*",
    "requests.*",
    "dotenv.*",
]
ignore_missing_imports = true

# Конфигурация pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

# Конфигурация coverage
[tool.coverage.run]
source = ["src"]
omit = [
    "*/__pycache__/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
fail_under = 80
show_missing = true
